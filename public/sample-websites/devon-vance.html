<script type="text/plain" id="app">
const {useState,useEffect,useRef,useMemo,useContext,createContext}=React;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const fmt=(n:number)=>Math.round(n).toLocaleString('en-US'),usd=(n:number)=>'$'+fmt(n);
const X=createContext(false);
function Xr({t}:{t:string}){return useContext(X)?<div className="xr"><b>CONVERSION FIX</b>{t}</div>:null}

// Critically damped spring (response .4s). Retargets from the live value and keeps velocity.
function useSpring(t:number):number{
 const [x,setX]=useState(t);const o=useRef({x:t,v:0,t,r:0,l:0}).current;
 useEffect(()=>{o.t=t;if(RM){o.x=t;setX(t);return}if(o.r)return;o.l=performance.now();
  const k=(6.2832/.4)**2,c=2*Math.sqrt(k);
  const f=(n:number)=>{const dt=Math.min((n-o.l)/1000,.032);o.l=n;o.v+=(k*(o.t-o.x)-c*o.v)*dt;o.x+=o.v*dt;
   if(Math.abs(o.t-o.x)<.01&&Math.abs(o.v)<.05){o.x=o.t;o.v=0;o.r=0;setX(o.x);return}setX(o.x);o.r=requestAnimationFrame(f)};
  o.r=requestAnimationFrame(f)},[t]);return x}
function Num({v,f=fmt}:{v:number;f?:(n:number)=>string}){return <span className="m">{f(useSpring(v))}</span>}
function Seg({o,v,on}:{o:string[];v:number;on:(i:number)=>void}){return <div className="seg" role="group">{o.map((l,i)=><button key={l} aria-pressed={i===v} onClick={()=>on(i)}>{l}</button>)}</div>}
async function copy(s:string,b:HTMLElement){try{await navigator.clipboard.writeText(s)}catch(e){const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
 const o=b.textContent;b.textContent='Copied ✓';setTimeout(()=>{b.textContent=o},1800)}

// Draggable bottom sheet: 1:1 tracking, velocity projection, rubber-banding, interruptible spring (damping .8, response .3).
function Sheet({open,onClose,title,children}:{open:boolean;onClose:()=>void;title:string;children:any}){
 const el=useRef<HTMLDivElement>(null),bg=useRef<HTMLDivElement>(null);
 const s=useRef({y:0,v:0,r:0,sy:0,y0:0,h:[] as number[][]}).current;
 const put=(y:number)=>{s.y=y;if(el.current)el.current.style.transform=`translateY(${y}px)`;if(bg.current)bg.current.style.opacity=String(Math.max(0,1-y/600))};
 const go=(to:number,v0:number,end?:()=>void)=>{cancelAnimationFrame(s.r);s.v=v0;if(RM){put(to);end&&end();return}
  let l=performance.now();const k=(6.2832/.3)**2,c=2*.8*Math.sqrt(k);
  const f=(n:number)=>{const dt=Math.min((n-l)/1000,.032);l=n;s.v+=(k*(to-s.y)-c*s.v)*dt;put(s.y+s.v*dt);
   if(Math.abs(to-s.y)<.5&&Math.abs(s.v)<5){put(to);end&&end();return}s.r=requestAnimationFrame(f)};s.r=requestAnimationFrame(f)};
 const close=(v=0)=>go(innerHeight,v,onClose);
 useEffect(()=>{if(!open)return;put(innerHeight);go(0,0);const k=(e:KeyboardEvent)=>{if(e.key==='Escape')close()};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[open]);
 const dn=(e:React.PointerEvent<HTMLDivElement>)=>{e.currentTarget.setPointerCapture(e.pointerId);cancelAnimationFrame(s.r);s.sy=e.clientY;s.y0=s.y;s.h=[[e.timeStamp,e.clientY]]};
 const mv=(e:React.PointerEvent<HTMLDivElement>)=>{if(!e.currentTarget.hasPointerCapture(e.pointerId))return;let y=s.y0+e.clientY-s.sy;if(y<0)y=-Math.pow(-y,.7);put(y);s.h=[...s.h,[e.timeStamp,e.clientY]].slice(-5)};
 const up=(e:React.PointerEvent<HTMLDivElement>)=>{if(!e.currentTarget.hasPointerCapture(e.pointerId))return;const a=s.h[0],b=s.h[s.h.length-1];
  const v=b[0]>a[0]?(b[1]-a[1])/(b[0]-a[0])*1000:0;(s.y+v*.499>240||v>700)&&v>-300?close(v):go(0,v)};
 if(!open)return null;
 return <><div className="scrim" ref={bg} onClick={()=>close()}/>
  <div className="sheet" ref={el} role="dialog" aria-modal="true" aria-label={title} style={{transform:'translateY(100vh)'}}>
   <div className="grab" onPointerDown={dn} onPointerMove={mv} onPointerUp={up} onPointerCancel={up}><i/><div className="sh"><h3 className="serif">{title}</h3><button className="x" aria-label="Close" onPointerDown={e=>e.stopPropagation()} onClick={()=>close()}>✕</button></div></div>
   <div className="sb">{children}</div></div></>}

// ---------- Pages ----------
const ARTS=[["Why your retry logic is the outage","11 min","Most cascading failures start as a well-meaning retry. Three layers each retried three times, and one slow dependency became twenty-seven requests per user action. Retry at exactly one layer, add jitter, and give every write an idempotency key so a replay is harmless."],
["State machines beat prompt chains","14 min","A prompt chain hides its control flow inside text, so when an agent loops nobody can say which state it was in. Model it as typed states with a step budget and a verifier gate, and you get replayable traces and bounded cost."],
["The $0.31 eval","9 min","Running 40K cases through a frontier model on every commit quietly outgrows the product it protects. Judge cheaply first and escalate only on disagreement. Regressions still get caught, and the median run drops to pocket change."]];
function Home(){const [i,setI]=useState(0);return <>
 <section className="hero w" style={{position:'relative'}}><Xr t="Four disconnected tools (Linktree, Notion, a form, Gumroad) became one calm front door with two clear paths. Visitors self-sort in a single click."/>
  <p className="eye">Devon Vance · Systems Architect</p>
  <h1 className="serif" style={{marginTop:18}}>Systems that survive <em>production.</em></h1>
  <p className="lead">I teach distributed systems and AI agents with real configs and real failure modes. Choose a path below: learn the craft, or sponsor it.</p>
  <div className="stats"><div><Num v={372400}/>+ combined reach</div><div><Num v={280000}/>YouTube subscribers</div><div><Num v={92000}/>weekly newsletter readers</div></div>
  <div className="logos"><small>Worked with</small><span>Linear</span><span>Raycast</span><span>Supabase</span><span>Chronosphere</span></div></section>
 <section className="w grid2"><a className="card" href="#/playbook"><p className="eye">For engineers</p><h2 className="serif" style={{margin:'10px 0'}}>Preview the Playbook</h2><p style={{color:'var(--t2)',marginBottom:18}}>Four modules with the architecture, config and benchmarks visible before you buy.</p><span className="go">Explore modules →</span></a>
 <a className="card" href="#/sponsor"><p className="eye">For brands</p><h2 className="serif" style={{margin:'10px 0'}}>Build a sponsorship</h2><p style={{color:'var(--t2)',marginBottom:18}}>Price a package live and see impressions, clicks and CPM move as you choose.</p><span className="go">Open the builder →</span></a></section>
 <section className="w"><p className="eye">Recent deep-dives · 2 Q2 sponsor slots remain</p><div className="side"><div>{ARTS.map((a,k)=><button key={k} className="opt" role="tab" aria-selected={k===i} onClick={()=>setI(k)}><h3 className="serif">{a[0]}</h3><p className="m">{a[1]} read</p></button>)}</div>
 <div className="card body" key={i} style={{animation:'in .4s both'}}><h2 className="serif">{ARTS[i][0]}</h2><p>{ARTS[i][2]}</p><p className="m sv" style={{fontSize:12}}>Preview · full breakdown ships in Friday’s issue</p></div></div></section></>}

interface Mod{n:string;s:string;fl:string[];c:string;b:[string,string,number][];d:string[]}
const MODS:Mod[]=[
{n:"Fault-Tolerant Queues",s:"Idempotency, backpressure, replay",fl:["Producer","Idempotency gate","Partitioned queue","Worker pool","Dead-letter + replay"],c:"queue: payments\n  partitions: 24            # key = account_id\n  retry: {max: 6, backoff: decorrelated-jitter}\n  idempotency: {ttl: 72h}\n  dlq: payments.dead        # replay via CLI",b:[["Duplicate side-effects","−99.4%",99],["p99 recovery","41s → 3s",93],["Pager events / month","−72%",72]],d:["Reference build in TypeScript and Go","Failure-injection harness","The 3 a.m. replay runbook"]},
{n:"Multi-Agent State Machines",s:"Typed transitions, bounded loops",fl:["Intent router","Planner","Tool executor","Verifier gate","Human checkpoint"],c:"agent: support-triage\n  budget: {steps: 12, usd: 0.40}\n  verify -> act:      on: fail, max: 2\n  verify -> escalate: on: low_confidence\n  trace: replayable         # deterministic seeds",b:[["Runaway loops","−94%",94],["Cost per resolved task","$0.62 → $0.19",69],["Debug time","−58%",58]],d:["State-graph template with typed schema","Trace viewer with replay","Tool-use guardrail checklist"]},
{n:"Zero-Downtime Migrations",s:"Dual-write, shadow-read, cutover",fl:["Dual-write","Shadow read","Backfill","Flagged cutover","Retire old path"],c:"migration: orders_v2\n  dual_write: {source_of_truth: v1}\n  diff_alert: {threshold: 0.001%}\n  backfill: {pause_on: replica_lag>2s}\n  cutover: flag://orders_v2   # instant rollback",b:[["Customer-visible downtime","0 min",100],["Rollback time","< 20s",90],["Data drift at cutover","0.0004%",96]],d:["Phase-by-phase checklist","Diff-checker with alerting","Rollback drill script"]},
{n:"Cost-Optimized Eval Pipelines",s:"Cheap judges, escalate on doubt",fl:["Case sampler","Cheap judge","Escalate on doubt","Regression gate","Cost ledger"],c:"eval: nightly\n  sampler: cluster_by(failure_signature)\n  judge: {primary: small, self_consistency: 3}\n  escalate: {when: disagreement>0.2}\n  ledger: per_commit_usd    # fail build if > $2",b:[["Eval cost per run","−81%",81],["Regressions caught","98.6%",99],["Median run time","46m → 9m",80]],d:["Harness with cost ledger","Judge-calibration notebook","CI gate recipes"]}];
const tier=(n:number):[number,string]=>n>=18?[.32,'Scale']:n>=11?[.25,'Growth']:n>=6?[.18,'Team']:[.1,'Starter'];
function Playbook(){const [mi,setMi]=useState(0),[tab,setTab]=useState(0),[hot,setHot]=useState(0),[team,setTeam]=useState(0),[seats,setSeats]=useState(3),[sheet,setSheet]=useState(false);
 const m=MODS[mi],[d,nm]=tier(seats),gross=seats*189,net=gross*(1-d),price=team?net:189;const [w,setW]=useState(false);
 useEffect(()=>{setHot(0);if(RM)return;const t=setInterval(()=>setHot(h=>(h+1)%5),900);return()=>clearInterval(t)},[mi,tab]);
 useEffect(()=>{setW(false);const r=requestAnimationFrame(()=>requestAnimationFrame(()=>setW(true)));return()=>cancelAnimationFrame(r)},[mi,tab]);
 const brief=`TEAM EXPENSE REIMBURSEMENT BRIEF\nProduct: Production Distributed Systems & AI Agent Playbook\nProvider: Devon Vance\n\nSeats: ${seats} × $189 = ${usd(gross)}\nVolume discount (${nm}, ${d*100}%): −${usd(gross*d)}\nTotal due: ${usd(net)} (${usd(net/seats)} per seat)\n\nJustification: training ${seats} engineers in fault-tolerant queues, agent state machines, zero-downtime migrations and cost-controlled evals to reduce incidents and on-call load. Category: professional development.`;
 return <section className="w" style={{position:'relative',paddingTop:70}}><Xr t="A static “Buy my course” card became a live product preview. Buyers inspect real architecture and benchmarks first, so the purchase decision happens in one scroll."/>
 <p className="eye">For engineers</p><h2 className="serif" style={{marginTop:10}}>Production Distributed Systems <em>&amp; AI Agent</em> Playbook</h2>
 <div className="side"><div>{MODS.map((x,i)=><button key={x.n} className="opt" role="tab" aria-selected={i===mi} onClick={()=>setMi(i)}><span className="eye" style={{color:'var(--t2)'}}>Module 0{i+1}</span><h3 className="serif">{x.n}</h3><p>{x.s}</p></button>)}</div>
 <div className="card body"><Seg o={["Architecture Flow","Config Snippet","Benchmark Impact"]} v={tab} on={setTab}/>
 {tab===0&&<div className="flow">{m.fl.map((n,i)=><React.Fragment key={n}>{i>0&&<span style={{color:'var(--t2)'}}>→</span>}<span className={'node'+(hot===i?' hot':'')}>{n}</span></React.Fragment>)}</div>}
 {tab===1&&<pre>{m.c.split('\n').map((l,i)=>{const k=l.indexOf('#');return <div key={i}>{k<0?l:<>{l.slice(0,k)}<span style={{color:'#6d6a62'}}>{l.slice(k)}</span></>}</div>})}</pre>}
 {tab===2&&m.b.map(b=><div className="bar" key={b[0]}><div><span>{b[0]}</span><span className="m">{b[1]}</span></div><div className="tr"><i style={{width:w?b[2]+'%':0}}/></div></div>)}
 <p style={{marginTop:22,fontSize:13}} className="eye">What you get</p>{m.d.map(x=><p key={x} style={{marginTop:6,color:'var(--t)',fontSize:14}}><span style={{color:'var(--a)',marginRight:8}}>◆</span>{x}</p>)}</div></div>
 <div className="card grid2" style={{marginTop:16,alignItems:'center'}}><div><Seg o={["Individual Engineer ($189)","Engineering Team License"]} v={team} on={setTeam}/>
 {team===1&&<div style={{marginTop:14}}><label className="m" style={{fontSize:12,color:'var(--t2)'}}>Seats: <b style={{color:'var(--t)'}}>{seats}</b></label><input type="range" min={3} max={25} value={seats} onChange={e=>setSeats(+e.target.value)} aria-label="Seats"/></div>}</div>
 <div><div className="big"><Num v={price} f={usd}/></div><p className="m" style={{fontSize:13,marginTop:6,color:'var(--t2)'}}>{team?<>{nm} tier · {d*100}% off · <span className="sv">saves {usd(gross*d)}</span> · {usd(net/seats)}/seat</>:'Lifetime updates included'}</p>
 {team===1&&<button className="btn" style={{marginTop:14}} onClick={()=>setSheet(true)}>Team Expense Reimbursement PDF Brief</button>}</div></div>
 <Sheet open={sheet} onClose={()=>setSheet(false)} title="Expense brief preview"><pre className="wrap">{brief}</pre><button className="btn" style={{width:'100%',marginTop:14}} onClick={e=>copy(brief,e.currentTarget)}>Copy brief</button></Sheet></section>}

interface It{id:string;n:string;d:string;p:number;i:number;c:[number,number]}
const IT:It[]=[{id:"mr",n:"60–90s YouTube Mid-Roll Integration",d:"Avg. 85K views",p:4200,i:85000,c:[.9,1.6]},{id:"dd",n:"Dedicated 15-Min Technical Product Deep-Dive",d:"High-intent launch format",p:9500,i:62000,c:[2.4,3.8]},{id:"nl",n:"Primary Newsletter Top-Slot Sponsorship",d:"92K subs · 48.4% verified open rate",p:1800,i:44528,c:[3.1,4.6]},{id:"sf",n:"Short-Form Technical Breakdown (X + Shorts)",d:"Cross-posted, evergreen",p:1400,i:120000,c:[.5,.9]}];
const CAD=[{n:"Single Launch Drop",m:1,d:0,s:"Standard rate"},{n:"Multi-Touch Campaign",m:2,d:.1,s:"2 months · 10% partner discount"},{n:"Quarter Category Exclusive",m:3,d:.18,s:"3 months · 18% off + bonus newsletter slot"}];
const PRE:[string,Record<string,number>][]=[["Launch Day",{mr:1,dd:1,nl:1,sf:0}],["Dev-Tool Awareness",{mr:2,dd:0,nl:2,sf:2}],["Category Owner",{mr:3,dd:1,nl:3,sf:3}]];
const MONTHS=Array.from({length:6},(_,i)=>new Date(2026,10+i,1).toLocaleString('en-US',{month:'long',year:'numeric'}));
function Sponsor(){const [q,setQ]=useState<Record<string,number>>({mr:1,dd:0,nl:1,sf:0}),[cd,setCd]=useState(0),[ct,setCt]=useState(1),[sh,setSh]=useState(false),[url,setUrl]=useState(''),[mo,setMo]=useState(MONTHS[0]),[er,setEr]=useState('');
 const c=useMemo(()=>{const C=CAD[cd];let g=0,im=0,cl=0;IT.forEach(t=>{g+=q[t.id]*t.p;im+=q[t.id]*t.i;cl+=q[t.id]*t.i*t.c[ct]/100});g*=C.m;im*=C.m;cl*=C.m;
  const bonus=cd===2&&im>0;if(bonus){im+=44528;cl+=44528*IT[2].c[ct]/100}const d=g*C.d;return{g,im,cl,d,n:g-d,cpm:im?(g-d)/im*1000:0,bonus,C}},[q,cd,ct]);
 const set=(id:string,v:number)=>setQ({...q,[id]:Math.max(0,Math.min(8,v))});
 const text=()=>`SPONSORSHIP PROPOSAL · Devon Vance\nBrand: ${url||'(add brand URL)'}\nTarget launch: ${mo}\nCadence: ${c.C.n} (${c.C.s})\n\nDELIVERABLES${c.C.m>1?' (monthly × '+c.C.m+')':''}\n${IT.filter(t=>q[t.id]).map(t=>`  • ${q[t.id]} × ${t.n}: ${usd(q[t.id]*t.p*c.C.m)}`).join('\n')}${c.bonus?'\n  • 1 × Bonus newsletter slot: $0':''}\n\nGross: ${usd(c.g)}\nBundle discount: −${usd(c.d)}\nNet investment: ${usd(c.n)}\n\nPROJECTED (${ct?'average':'conservative'} CTR)\n  Verified impressions: ${fmt(c.im)}\n  High-intent clicks: ${fmt(c.cl)}\n  Blended CPM: $${c.cpm.toFixed(2)}`;
 return <section className="w" style={{position:'relative',paddingTop:70}}><Xr t="A live quote tool replaces the static PDF media kit and the email ping-pong, cutting roughly 70% of sponsor qualification friction."/>
 <p className="eye">For brand sponsors</p><h2 className="serif" style={{marginTop:10}}>Build your package. <em>Watch the math move.</em></h2>
 <div className="cpq"><div className="card"><Seg o={PRE.map(p=>p[0])} v={-1} on={i=>{setQ({...PRE[i][1]});setCd(i)}}/>
 <div style={{marginTop:8}}>{IT.map(t=><div key={t.id} className={'row'+(q[t.id]?' on':'')}><button className="chk" aria-label={'Toggle '+t.n} onClick={()=>set(t.id,q[t.id]?0:1)}>✓</button><div><b style={{fontWeight:500}}>{t.n}</b><p>{t.d}</p></div><span className="m" style={{fontSize:13}}>{usd(t.p)}</span><div className="st"><button aria-label="Fewer" onClick={()=>set(t.id,q[t.id]-1)}>−</button><span>{q[t.id]}</span><button aria-label="More" onClick={()=>set(t.id,q[t.id]+1)}>+</button></div></div>)}</div>
 <p className="eye" style={{margin:'18px 0 10px'}}>Cadence</p><Seg o={CAD.map(x=>x.n)} v={cd} on={setCd}/><p className="m" style={{fontSize:12,color:'var(--t2)',marginTop:8}}>{CAD[cd].s}</p></div>
 <div className="card" style={{position:'sticky',top:80}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}><p className="eye" style={{color:'var(--e)'}}>Live telemetry</p><Seg o={["Conservative CTR","Average CTR"]} v={ct} on={setCt}/></div>
 <div className="big" style={{marginTop:18}}><Num v={c.im}/></div><p style={{fontSize:13,color:'var(--t2)'}}>projected verified impressions</p>
 <div className="grid2" style={{margin:'18px 0',gap:10}}><div><div className="m" style={{fontSize:21}}><Num v={c.cl}/></div><p style={{fontSize:12,color:'var(--t2)'}}>high-intent clicks</p></div><div><div className="m sv" style={{fontSize:21}}><Num v={c.cpm} f={n=>'$'+n.toFixed(2)}/></div><p style={{fontSize:12,color:'var(--t2)'}}>blended CPM</p></div></div>
 <div className="mx"><span>Gross</span><Num v={c.g} f={usd}/></div><div className="mx"><span>Bundle discount saved</span><span className="sv"><Num v={c.d} f={n=>'−'+usd(n)}/></span></div><div className="mx n"><span>Net investment</span><Num v={c.n} f={usd}/></div>
 {c.bonus&&<p className="sv m" style={{fontSize:12}}>+ bonus newsletter slot included</p>}
 <button className="btn" disabled={!c.im} style={{width:'100%',marginTop:16}} onClick={()=>setSh(true)}>Lock In Package &amp; Generate Sponsor Brief →</button></div></div>
 <Sheet open={sh} onClose={()=>setSh(false)} title="Sponsor proposal"><label className="m" style={{fontSize:12,color:'var(--t2)'}}>Target launch month</label><select className="in" value={mo} onChange={e=>setMo(e.target.value)}>{MONTHS.map(x=><option key={x}>{x}</option>)}</select>
 <label className="m" style={{fontSize:12,color:'var(--t2)',display:'block',marginTop:12}}>Brand URL</label><input className="in" type="url" placeholder="https://yourbrand.com" value={url} onChange={e=>{setUrl(e.target.value);setEr('')}}/><div className="err">{er}</div>
 <pre className="wrap" style={{marginTop:6}}>{text()}</pre><button className="btn" style={{width:'100%',marginTop:14}} onClick={e=>{if(!/^https?:\/\/[^\s.]+\.\S{2,}$/.test(url.trim())){setEr('Enter a full URL, e.g. https://yourbrand.com');return}copy(text(),e.currentTarget)}}>Copy Formatted Proposal to Clipboard</button></Sheet></section>}

const DEM:Record<string,[string,number][]>={"Audience by Role":[["Senior / Staff SWE",44],["Founders / CTOs",26],["Full-Stack",19],["AI / ML",11]],"Geography":[["US / Canada",62],["Europe / UK",24],["APAC / India",14]]};
const CS=[{n:"Raycast",ch:"Launch a new extensions API to senior engineers who ignore display ads.",f:"Deep-dive + newsletter top slot",cl:6840,cv:"4.1%",o:"Signups beat the team’s paid-social benchmark at a fraction of the cost per acquisition."},{n:"Supabase",ch:"Move teams off hand-rolled auth without sounding like a pitch.",f:"Mid-roll + short-form breakdown",cl:4190,cv:"5.6%",o:"Best conversion of the year. The short clip built intent and the mid-roll closed it."},{n:"Chronosphere",ch:"Reach staff-level buyers who own observability budgets.",f:"Quarter category exclusive",cl:11300,cv:"3.2%",o:"Three touches across 12 weeks produced steady demo requests and an enterprise pilot."}];
function Proof(){const [d,setD]=useState(0),[c,setC]=useState(0),[w,setW]=useState(false);const k=Object.keys(DEM)[d],cs=CS[c];
 useEffect(()=>{setW(false);const r=requestAnimationFrame(()=>requestAnimationFrame(()=>setW(true)));return()=>cancelAnimationFrame(r)},[d]);
 return <section className="w" style={{position:'relative',paddingTop:70}}><Xr t="Blurry analytics screenshots became interactive, labelled data. Buyers can verify who they are paying to reach without a sales call."/>
 <p className="eye">Proof</p><h2 className="serif" style={{marginTop:10}}>Who’s actually <em>watching.</em></h2>
 <div className="grid2" style={{marginTop:26,alignItems:'start'}}><div className="card"><Seg o={Object.keys(DEM)} v={d} on={setD}/>{DEM[k].map(r=><div className="bar" key={r[0]}><div><span>{r[0]}</span><span className="m">{r[1]}%</span></div><div className="tr"><i style={{width:w?r[1]+'%':0}}/></div></div>)}</div>
 <div className="card body"><Seg o={CS.map(x=>x.n)} v={c} on={setC}/><div key={c} style={{animation:'in .4s both'}}><p><b style={{color:'var(--t)',fontWeight:500}}>Challenge.</b> {cs.ch}</p><p><b style={{color:'var(--t)',fontWeight:500}}>Format.</b> {cs.f}</p>
 <div className="grid2" style={{margin:'18px 0',gap:10}}><div><div className="big" style={{fontSize:'2rem'}}><Num v={cs.cl}/></div><p style={{margin:0,fontSize:12}}>tracked clicks</p></div><div><div className="big sv" style={{fontSize:'2rem'}}>{cs.cv}</div><p style={{margin:0,fontSize:12}}>sign-up conversion</p></div></div><p>{cs.o}</p></div></div></div>
 <p className="m" style={{fontSize:11,color:'var(--t2)',marginTop:18}}>Concept build for portfolio purposes: campaign figures are illustrative.</p></section>}

const LINKS:[string,string][]=[['#/','Overview'],['#/playbook','Playbook'],['#/sponsor','Sponsor'],['#/proof','Proof']];
function Nav({h}:{h:string}){const r=useRef<HTMLElement>(null),[p,setP]=useState({l:0,w:0});
 useEffect(()=>{const a=r.current?.querySelector('[aria-current]') as HTMLElement|null;if(a)setP({l:a.offsetLeft,w:a.offsetWidth})},[h]);
 return <nav ref={r}><i style={{transform:`translateX(${p.l}px)`,width:p.w}}/>{LINKS.map(([k,l])=><a key={k} href={k} aria-current={h===k?'page':undefined}>{l}</a>)}</nav>}
function App(){const [h,setH]=useState(location.hash||'#/'),[x,setX]=useState(false);
 useEffect(()=>{const f=()=>{setH(location.hash||'#/');scrollTo(0,0)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
 const P=h==='#/playbook'?Playbook:h==='#/sponsor'?Sponsor:h==='#/proof'?Proof:Home;
 return <X.Provider value={x}><header><div className="w hr"><a className="brand" href="#/">Devon Vance</a><Nav h={LINKS.some(l=>l[0]===h)?h:'#/'}/></div></header>
 <main className="page" key={h}><P/></main>
 <button id="xp" aria-pressed={x} onClick={()=>setX(!x)}>✦ Agency Audit X-Ray: {x?'ON':'OFF'}</button></X.Provider>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
